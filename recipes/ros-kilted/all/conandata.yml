sources:
  # Consider matching the recipe version to the snapshot date (e.g. 20250728)
  "0.1.0":
    url: "https://raw.githubusercontent.com/ros2/ros2/release-kilted-20250728/ros2.repos"
    sha256: "2ee28764efa0b6dd1dbe90607986387c9d668b186bfac0edbabdd9c5ee834d1b"
    # To find the ros2/variants metapackages tag (not in ros2.repos) that matches the snapshot above:
    #   https://raw.githubusercontent.com/ros/rosdistro/master/kilted/distribution.yaml
    #   -> variants.release.version (e.g. "0.12.0-2"; strip the "-N" bloom suffix).
    variants:
      url: "https://github.com/ros2/variants/archive/refs/tags/0.12.0.tar.gz"
      sha256: "5089bf2dea8368020243d40a2b513405cd060aacc42de6fae2289c1a87f74f99"
    # Repos required for desktop+ that are absent from ros2.repos.
    # Each entry matches a vcs-tools repos file entry (type/url/version).
    desktop_extras:
      ros-perception/vision_opencv:
        type: git
        url: https://github.com/ros-perception/vision_opencv.git
        version: "4.1.0"
      ros-visualization/rqt_image_view:
        type: git
        url: https://github.com/ros-visualization/rqt_image_view.git
        version: "1.3.3"
      ros-perception/image_pipeline:
        type: git
        url: https://github.com/ros-perception/image_pipeline.git
        version: "6.0.12"
      ros-perception/perception_pcl:
        type: git
        url: https://github.com/ros-perception/perception_pcl.git
        version: "2.8.0"
      ros-perception/depthimage_to_laserscan:
        type: git
        url: https://github.com/ros-perception/depthimage_to_laserscan.git
        version: "2.5.1"
      ros-perception/laser_filters:
        type: git
        url: https://github.com/ros-perception/laser_filters.git
        version: "2.2.3"
      ros/filters:
        type: git
        url: https://github.com/ros/filters.git
        version: "2.2.2"
      ros/xacro:
        type: git
        url: https://github.com/ros/xacro.git
        version: "2.1.1"
      CCNYRoboticsLab/imu_tools:
        type: git
        url: https://github.com/CCNYRoboticsLab/imu_tools.git
        version: "2.2.1"
      ros-perception/vision_msgs:
        type: git
        url: https://github.com/ros-perception/vision_msgs.git
        version: "4.2.0"
      rudislabs/actuator_msgs:
        type: git
        url: https://github.com/rudislabs/actuator_msgs.git
        version: "0.0.1"
      swri-robotics/gps_umd:
        type: git
        url: https://github.com/swri-robotics/gps_umd.git
        version: "2.1.2"
      apl-ocean-engineering/marine_msgs:
        type: git
        url: https://github.com/apl-ocean-engineering/marine_msgs.git
        version: "2.1.0"
      ros2/python_cmake_module:
        type: git
        url: https://github.com/ros2/python_cmake_module.git
        version: "0.12.0"
      ros/angles:
        type: git
        url: https://github.com/ros/angles.git
        version: "1.16.1"
      ros-drivers/joystick_drivers:
        type: git
        url: https://github.com/ros-drivers/joystick_drivers.git
        version: "3.3.0"
      ros2/teleop_twist_joy:
        type: git
        url: https://github.com/ros2/teleop_twist_joy.git
        version: "2.6.5"
      ros2/teleop_twist_keyboard:
        type: git
        url: https://github.com/ros2/teleop_twist_keyboard.git
        version: "2.4.1"

patches:
  "0.1.0":
    - patch_file: patches/0001-google-benchmark-vendor-conan-shared-benchmark.patch
      patch_description: google_benchmark_vendor - shared lib check on benchmark::benchmark (Conan)
    - patch_file: patches/0002-rosidl-generator-py-msvc-short-object-dir.patch
      patch_description: rosidl_generator_py - MSVC /Fo short dir (MAX_PATH on .obj under VS generator)
    - patch_file: patches/0003-rviz-ogre-vendor-ogre-lod-cpp17.patch
      patch_description: rviz_ogre_vendor - OGRE 1.12.10 C++17 LOD patch + Assimp fix::assimp uses assimp::assimp (Conan headers for Codec_Assimp)
    - patch_file: patches/0004-rviz-ogre-vendor-conan-zlib-freetype-windows.patch
      patch_description: rviz_ogre_vendor - Windows use find_package ZLIB/Freetype (Conan); forward toolchain to OGRE ExternalProject
    - patch_file: patches/0005-orocos-kdl-vendor-conan-and-boost.patch
      patch_description: orocos_kdl_vendor - prefer CMakeDeps orocos_kdl from ros2_ws/conan; prepend conan to CMAKE_PREFIX_PATH and INTERFACE-link Boost for KDL headers (CMakeDeps)
    - patch_file: patches/0006-rviz-ogre-vendor-msvc-runtime-for-ogre-subbuild.patch
      patch_description: rviz_ogre_vendor - forward CMP0091 and CMAKE_MSVC_RUNTIME_LIBRARY into OGRE ExternalProject (Codec_Assimp LNK2038)
    - patch_file: patches/0007-python-orocos-kdl-vendor-conan-and-apple.patch
      patch_description: python_orocos_kdl_vendor - prefer Conan python_orocos_kdl CMake package; strip py::hash(py::self) on Apple when building PyKDL from FetchContent
    - patch_file: patches/0009-mcap-vendor-use-conan.patch
      patch_description: mcap_vendor - replace FetchContent of foxglove/mcap with find_package(mcap) (CCI mcap)
    - patch_file: patches/0010-rviz-ogre-vendor-extras-conan-zlib-windows.patch
      patch_description: rviz_ogre_vendor-extras - drop unused FREETYPE_HOME/ZLIB_HOME; freetype via CONFIG (no vendored freetype_DIR); Freetype::Freetype + ZLIB::ZLIB for Conan
    - patch_file: patches/0011-gz-cmake-vendor-extras-prepend-opt-prefix.patch
      patch_description: gz_cmake_vendor - prepend <install>/opt/gz_cmake_vendor in extras so downstream vendor ExternalProject configs can resolve find_package(gz-cmake4) on Windows
    - patch_file: patches/0012-gz-utils-vendor-extras-prepend-opt-prefix.patch
      patch_description: gz_utils_vendor - prepend <install>/opt/gz_utils_vendor in extras so downstream vendor ExternalProject configs can resolve find_package(gz-utils3) on Windows
    - patch_file: patches/0013-gz-math-vendor-extras-prepend-opt-prefix.patch
      patch_description: gz_math_vendor - prepend <install>/opt/gz_math_vendor in extras so downstream vendor ExternalProject configs can resolve find_package(gz-math8) on Windows
    - patch_file: patches/0014-iceoryx-hoofs-time-include-chrono.patch
      patch_description: iceoryx_hoofs - explicit #include <chrono> in win/source/time.cpp (MSVC 17.13+ no longer transitively pulls in std::chrono::system_clock; iceoryx upstream PR #2378 not backported to v2.0.5)
    - patch_file: patches/0015-qt-gui-cpp-shiboken-find-qt5-components.patch
      patch_description: qt_gui_cpp_shiboken - use find_package(Qt5 COMPONENTS Widgets) instead of find_package(Qt5Widgets); Conan CMakeDeps generates Qt5Config.cmake but not Qt5WidgetsConfig.cmake
    - patch_file: patches/0016-qt-gui-cpp-optional-python-bindings.patch
      patch_description: qt_gui_cpp - downgrade FATAL_ERROR to WARNING when no Python binding generator (Shiboken/SIP) is available; neither is present in a Conan-only build
    - patch_file: patches/0017-rqt-image-view-find-qt5-components.patch
      patch_description: rqt_image_view - use find_package(Qt5 COMPONENTS Widgets) instead of find_package(Qt5Widgets); Conan CMakeDeps generates Qt5Config.cmake but not Qt5WidgetsConfig.cmake
    - patch_file: patches/0018-sdl2-vendor-macos-no-declaration-after-statement.patch
      patch_description: sdl2_vendor - pass -Wno-declaration-after-statement to SDL2 ExternalProject on Apple; SDL2-2.0.20 enables -Werror=declaration-after-statement which breaks SDL_rwopsbundlesupport.m under Apple clang 16+
