name: Conan create ros-kilted

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  conan-create:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            conan_home: C:/.c2
            variant: core
          - runner: macos-latest
            conan_home: /tmp/conan-ci
            variant: core
          - runner: ubuntu-latest
            conan_home: /tmp/conan-ci
            variant: core
          - runner: ubuntu-latest
            conan_home: /tmp/conan-ci
            variant: desktop
            run_examples: false
          - runner: windows-2022
            conan_home: C:/.c2
            variant: desktop
            run_examples: false
          - runner: macos-latest
            conan_home: /tmp/conan-ci
            variant: desktop
            run_examples: false

    runs-on: ${{ matrix.runner }}
    env:
      CONAN_HOME: ${{ matrix.conan_home }}
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
      CONAN_LOGIN_USERNAME: ${{ secrets.ARTIFACTORY_USER }}
      CONAN_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

    steps:
      - name: Enable long paths for git
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Conan home
        shell: bash
        run: mkdir -p "$CONAN_HOME"

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2.2
        with:
          cmake-version: "3.31.0"

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          update-environment: false

      - name: Prepend Python to System PATH
        shell: bash
        run: echo "$(dirname '${{ steps.setup_python.outputs.python-path }}')" >> "$GITHUB_PATH"

      # windows-2022 runners are Azure VMs with Service Fabric pre-installed. Its bin directory
      # appears before C:\Windows\System32 in PATH, so the Windows loader picks up Service
      # Fabric's incompatible msvcp140.dll instead of the System32 copy. That ABI mismatch
      # causes an access violation (0xC0000005) inside rcl_init() on any ros2 command startup.
      # Strip Service Fabric paths from PATH so the loader finds the correct MSVC runtime DLLs.
      - name: Remove Service Fabric from PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = ($env:PATH -split ';') | Where-Object { $_ -notmatch 'Service.Fabric' }
          "PATH=$($path -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install latest Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan "numpy<2"
          conan --version

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Add local recipes index
        working-directory: ${{ github.workspace }}
        run: conan remote add conan-ros-index . --type=local-recipes-index

      - name: Add Artifactory Conan remote
        shell: bash
        run: |
          conan remote add conan-ros "$ARTIFACTORY_URL"
          conan remote login conan-ros

      - name: Show ros-kilted revisions in Artifactory
        run: conan list "ros-kilted/0.1.0#*:*" -r=conan-ros -f=compact

      - name: Export ros-kilted recipe
        working-directory: ${{ github.workspace }}
        run: conan export recipes/ros-kilted/all --version=0.1.0

      - name: Install ros-kilted (build missing from source)
        working-directory: ${{ github.workspace }}
        run: >
          conan install --requires=ros-kilted/0.1.0
          --build=missing
          --profile:all=profiles/ros
          -o ros-kilted/*:variant=${{ matrix.variant }}
          --format=json --out-file=install_graph.json

      # Uploads every binary that built from source (binary=Build)
      - name: Upload binaries built from source to Artifactory
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          conan list --graph=install_graph.json --graph-binaries=build --format=json > upload_pkglist.json
          if python -c "import json,sys; d=json.load(open('upload_pkglist.json')); sys.exit(0 if d.get('Local Cache') else 1)"; then
            conan upload --list=upload_pkglist.json -r conan-ros -c
          fi

      - name: Run ros-kilted test_package
        working-directory: ${{ github.workspace }}
        run: >
          conan test recipes/ros-kilted/all/test_package ros-kilted/0.1.0
          --profile:all=profiles/ros
          -o ros-kilted/*:variant=${{ matrix.variant }}

      - name: Find and run examples
        if: matrix.run_examples != false
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -u "${{ github.workspace }}/.github/run_ci_tests.py"
